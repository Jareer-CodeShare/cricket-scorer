name: cricket_scorer
description: Offline cricket match scoring app for EF101-P02. A human scorer enters what happens on each ball; the app applies the rules of cricket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"

flutter:
  uses-material-design: true
